# Copy to aumbry.toml (or /etc/aumbry/config.toml) and fill in all required values.
# Because this file contains secrets, restrict permissions:
#   - Running directly on the host:   chmod 600 aumbry.toml
#   - Running in Docker (UID/GID 65532 nonroot user cannot read a host user's 0600 file):
#       sudo chgrp 65532 aumbry.toml && chmod 640 aumbry.toml
#     (640 with group 65532 is preferred over 644 so other local users cannot read secrets;
#      aumbry-server logs a reminder when group-readable unless you chown 65532:65532 with chmod 600.)
#
# Config lookup order (first match wins):
#   --config <path> -> AUMBRY_CONFIG -> ./aumbry.toml -> /etc/aumbry/config.toml
# Any AUMBRY_* environment variable overrides the corresponding TOML key.
#
# IMPORTANT — SINGLE INSTANCE ONLY:
# Aumbry uses a single SQLite writer connection and in-memory rate limiters.
# Do NOT run multiple server replicas against the same data_dir and object store.

# HTTP listen address (env: AUMBRY_LISTEN_ADDR, default: ":8080")
listen_addr = ":8080"

# Directory for SQLite database aumbry.db (env: AUMBRY_DATA_DIR, required)
# Uses "/data" for the container volume; change to e.g. "./data" when running directly on the host.
data_dir = "/data"

# Object storage backend: "local" (default), "webdav", "s3", or "r2" (env: AUMBRY_STORAGE)
storage = "local"

# Bearer tokens accepted by POST /api/v1/ingest (env: AUMBRY_API_TOKENS, comma-separated, required)
api_tokens = ["replace-with-random-bearer-token"]

# At least 32 random bytes, e.g. `openssl rand -hex 32` (env: AUMBRY_COOKIE_SECRET, required)
cookie_secret = "replace-with-at-least-32-random-bytes-for-cookies"

# Reverse proxy IPs or CIDRs whose X-Forwarded-For and X-Forwarded-Proto headers are trusted.
# Empty by default (all forwarding headers ignored). (env: AUMBRY_TRUSTED_PROXIES, comma-separated)
trusted_proxies = []

# Canonical public origin used to build links and <enclosure> URLs in /feeds/ RSS/Podcast feeds.
# Leave empty to derive scheme/host from the incoming request (honoring trusted_proxies).
# Must be http(s)://host[:port] with no path, query, fragment, or userinfo. (env: AUMBRY_PUBLIC_URL)
public_url = ""

[revisions]
# Maximum published revisions kept per item; oldest revisions are pruned FIFO.
# 0 means unlimited; negative values fail startup. (env: AUMBRY_REVISIONS_MAX_PER_ITEM)
max_per_item = 20

[ingest]
# Maximum multipart request body size in MiB for POST /api/v1/ingest (minimum 20).
# Server temporary storage should reserve at least 4 x max_body_mb for concurrent uploads.
# (env: AUMBRY_INGEST_MAX_BODY_MB)
max_body_mb = 200

[admin]
# Administrator username (env: AUMBRY_ADMIN_USER, required)
user = "admin"

# bcrypt hash of the admin password (env: AUMBRY_ADMIN_PASSWORD_HASH, required):
#   htpasswd -nbBC 10 '' 'your-password' | cut -d: -f2
# Note: "$" does NOT need escaping inside TOML basic strings.
# The value below is a valid placeholder hash of the password "change-me" so this file passes
# `aumbry-server check-config`. You MUST replace it with your own hash before deploying.
password_hash = "$2a$10$PkHvdR6kLHeZaneIL82t..LG5KvAbbJzODtrZiiF5g/7kmHljVAUa"

[local]
# Optional object root when storage = "local" (env: AUMBRY_LOCAL_PATH).
# Defaults to "<data_dir>/objects" when omitted or empty.
# path = "/data/objects"

# --- Alternative storage backends (also set storage = "webdav" / "s3" / "r2" above) ---

# [webdav]
# url = "https://dav.example.com/aumbry"   # env: AUMBRY_WEBDAV_URL
# user = "aumbry"                          # env: AUMBRY_WEBDAV_USER
# password = "replace-with-webdav-password" # env: AUMBRY_WEBDAV_PASS

# [s3]
# endpoint = "http://minio:9000"           # env: AUMBRY_S3_ENDPOINT (omit for AWS S3)
# region = "us-east-1"                     # env: AUMBRY_S3_REGION (required if endpoint empty; defaults to "auto")
# bucket = "aumbry"                        # env: AUMBRY_S3_BUCKET
# path_style = true                        # env: AUMBRY_S3_PATH_STYLE
# access_key_id = "..."                    # env: AUMBRY_S3_ACCESS_KEY_ID
# secret_access_key = "..."                # env: AUMBRY_S3_SECRET_ACCESS_KEY

# Cloudflare R2 (checked against official docs; not verified on a live R2 account)
# [r2]
# account_id = "<32-hex-account-id>"       # env: AUMBRY_R2_ACCOUNT_ID
# bucket = "aumbry"                        # env: AUMBRY_R2_BUCKET
# access_key_id = "..."                    # env: AUMBRY_R2_ACCESS_KEY_ID
# secret_access_key = "..."                # env: AUMBRY_R2_SECRET_ACCESS_KEY
