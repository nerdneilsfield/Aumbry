version: 2
env:
  - CGO_ENABLED=0

before:
  hooks:
    - make setup
    - make frontend

builds:
  - id: cli
    main: .
    binary: aumbry
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/nerdneilsfield/aumbry/internal/buildinfo.Version={{.Version}}
      - -X github.com/nerdneilsfield/aumbry/internal/buildinfo.Commit={{.FullCommit}}
      - -X github.com/nerdneilsfield/aumbry/internal/buildinfo.Date={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: server
    main: ./cmd/server
    binary: aumbry-server
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/nerdneilsfield/aumbry/internal/buildinfo.Version={{.Version}}
      - -X github.com/nerdneilsfield/aumbry/internal/buildinfo.Commit={{.FullCommit}}
      - -X github.com/nerdneilsfield/aumbry/internal/buildinfo.Date={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - ids: [cli, server]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*
      - skills/aumbry/**

# GoReleaser creates a Syft SBOM per archive when `sboms` is unset; disable it explicitly (PRD 1.3, 5.2).
sboms:
  - disable: true

# Published to the shared tap/bucket repository on release. TAP_GITHUB_TOKEN needs contents:write on that repository only.
homebrew_casks:
  - name: aumbry
    binaries: [aumbry, aumbry-server]
    homepage: https://github.com/nerdneilsfield/Aumbry
    description: Private, searchable hub for AI-agent research reports
    directory: Casks
    repository:
      owner: nerdneilsfield
      name: homebrew-apps
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/aumbry"]
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/aumbry-server"]
          end

scoops:
  - name: aumbry
    homepage: https://github.com/nerdneilsfield/Aumbry
    description: Private, searchable hub for AI-agent research reports
    license: MIT
    directory: bucket
    repository:
      owner: nerdneilsfield
      name: homebrew-apps
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"

dockers_v2:
  - id: aumbry
    ids:
      - cli
      - server
    dockerfile: Dockerfile.release
    images:
      - ghcr.io/nerdneilsfield/aumbry
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: false
    labels:
      org.opencontainers.image.source: https://github.com/nerdneilsfield/Aumbry
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.description: "Private, searchable hub for AI-agent research reports"
    annotations:
      "index,manifest:org.opencontainers.image.source": https://github.com/nerdneilsfield/Aumbry
      "index,manifest:org.opencontainers.image.version": "{{ .Version }}"
      "index,manifest:org.opencontainers.image.revision": "{{ .FullCommit }}"
      "index,manifest:org.opencontainers.image.created": "{{ .Date }}"
      "index,manifest:org.opencontainers.image.licenses": MIT
      "index,manifest:org.opencontainers.image.description": "Private, searchable hub for AI-agent research reports"

release:
  github:
    owner: nerdneilsfield
    name: Aumbry

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^test:'
      - '^chore'
      - 'merge conflict'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
