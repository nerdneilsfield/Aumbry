version: 2
env:
  - CGO_ENABLED=0

before:
  hooks:
    - make setup
    - make frontend

builds:
  - id: cli
    main: .
    binary: aumbry
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/nerdneilsfield/aumbry/internal/buildinfo.Version={{.Version}}
      - -X github.com/nerdneilsfield/aumbry/internal/buildinfo.Commit={{.FullCommit}}
      - -X github.com/nerdneilsfield/aumbry/internal/buildinfo.Date={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: server
    main: ./cmd/server
    binary: aumbry-server
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/nerdneilsfield/aumbry/internal/buildinfo.Version={{.Version}}
      - -X github.com/nerdneilsfield/aumbry/internal/buildinfo.Commit={{.FullCommit}}
      - -X github.com/nerdneilsfield/aumbry/internal/buildinfo.Date={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - ids: [cli, server]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*
      - skills/aumbry/**

dockers_v2:
  - id: aumbry
    ids:
      - cli
      - server
    dockerfile: Dockerfile.release
    images:
      - ghcr.io/nerdneilsfield/aumbry
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: false
    labels:
      org.opencontainers.image.source: https://github.com/nerdneilsfield/Aumbry
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.description: "Private, searchable hub for AI-agent research reports"
    annotations:
      "index,manifest:org.opencontainers.image.source": https://github.com/nerdneilsfield/Aumbry
      "index,manifest:org.opencontainers.image.version": "{{ .Version }}"
      "index,manifest:org.opencontainers.image.revision": "{{ .FullCommit }}"
      "index,manifest:org.opencontainers.image.created": "{{ .Date }}"
      "index,manifest:org.opencontainers.image.licenses": MIT
      "index,manifest:org.opencontainers.image.description": "Private, searchable hub for AI-agent research reports"

release:
  github:
    owner: nerdneilsfield
    name: Aumbry

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^test:'
      - '^chore'
      - 'merge conflict'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
