# Mounted as /etc/nginx/conf.d/default.conf in the official nginx image.

server {
    listen 80;
    listen [::]:80;
    server_name aumbry.example.com;   # replace with your host name

    # HTTP -> HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aumbry.example.com;   # replace with your host name

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Aumbry accepts at most 100 MiB per POST /api/v1/ingest (nginx "m" means MiB).
    # Keep this larger than that so an oversized request reaches Aumbry and gets its JSON
    # error (413 too_large) instead of an nginx HTML page.
    client_max_body_size 101m;

    location / {
        proxy_pass http://aumbry:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # Appends the client address to any X-Forwarded-For the client sent. Aumbry reads the
        # header from the right and skips trusted proxies, so forged left-hand entries are ignored.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Aumbry uploads the objects of an ingest request to WebDAV before it answers, so a
        # large push can leave the connection silent for longer than nginx's 60 s default
        # (these timeouts apply between two reads or writes, not to the whole request).
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
