# Mounted as /etc/nginx/conf.d/default.conf in the official nginx image.

# Omit query strings in access logs so protected directory `?token=ad_...` secrets never hit disk.
log_format aumbry_no_query '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name aumbry.example.com;   # replace with your host name

    access_log /var/log/nginx/access.log aumbry_no_query;

    # HTTP -> HTTPS (strip query string on HTTP cleartext redirect too or use $request_uri without logging tokens)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aumbry.example.com;   # replace with your host name

    access_log /var/log/nginx/access.log aumbry_no_query;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Aumbry defaults to 200 MiB per POST /api/v1/ingest (ingest.max_body_mb, nginx "m" means MiB).
    # Keep this larger than ingest.max_body_mb so an oversized request reaches Aumbry and gets its
    # JSON error (413 too_large) instead of an nginx HTML page.
    client_max_body_size 201m;

    # Never enable proxy caching on /feeds/ (protected feeds embed `?token=` enclosure URLs and
    # send `Cache-Control: private, no-store`).
    location / {
        proxy_pass http://aumbry:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        # Appends the client address to any X-Forwarded-For the client sent. Aumbry reads the
        # header from the right and skips trusted proxies, so forged left-hand entries are ignored.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Aumbry uploads the objects of an ingest request to object storage before it answers, so a
        # large push can leave the connection silent for longer than nginx's 60 s default
        # (these timeouts apply between two reads or writes, not to the whole request).
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
