services:
  aumbry:
    build: .
    # Values containing "$" (the admin bcrypt hash) must be single-quoted in .env.
    # If you write them in an `environment:` block here instead, double every "$" as "$$".
    env_file:
      - .env
    environment:
      AUMBRY_DATA_DIR: /data
    ports:
      - "8080:8080"
    volumes:
      - aumbry-data:/data
    restart: unless-stopped

volumes:
  aumbry-data:
