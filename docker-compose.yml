# Env-based deployment (single instance only — do not scale > 1).
# Reads settings from .env (copy .env.example to .env), then run `docker compose up --build`.
# For TOML-based configuration instead of .env, use: docker compose -f docker-compose.toml.yml up --build

services:
  aumbry:
    build: .
    image: ghcr.io/nerdneilsfield/aumbry:latest
    # Values containing "$" (the admin bcrypt hash) must be single-quoted in .env.
    # If you write them in an `environment:` block here instead, double every "$" as "$$".
    env_file:
      - .env
    environment:
      AUMBRY_DATA_DIR: /data
    ports:
      - "8080:8080"
    volumes:
      - aumbry-data:/data
    restart: unless-stopped

volumes:
  aumbry-data:
